name: Member PWA CI

on:
  pull_request:
    paths:
      - 'gymflow-member/**'
      - '.github/workflows/member-pwa-ci.yml'
  push:
    branches: [main]
    paths:
      - 'gymflow-member/**'
      - '.github/workflows/member-pwa-ci.yml'

permissions:
  contents: read

concurrency:
  group: member-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gymflow-member
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_APP_URL: https://member.gymflow.sbs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gymflow-member/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
