<!doctype html>
<!--
  en-IN, not plain en: og:locale already declares en_IN and the JSON-LD declares
  inLanguage en-IN, so a bare "en" here was the one place disagreeing about which
  English this is. Regional consistency is a small ranking and answer-engine
  signal for an India-only product.
-->

      Two theme-colors, one per scheme, so the mobile browser chrome matches the
      surface it sits above instead of fighting it. These are the exact
      --background values from src/index.css; if those change, change these.
    -->

    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!--
      Instrument Serif is requested italic-only (ital@1) and at a single weight,
      because the sole thing it sets is the emphasised words in the hero heading.
      Asking for the roman too would double the payload for glyphs never drawn.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..900&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@1&display=swap"

    <!--
      Canonical URL. Consolidates the http:// variant and every ?utm_source=…
      share link, which would otherwise look like separate pages with identical
      content and split ranking signals.

      NOTE THE www. The apex returns 308 -> https://www.gymflow.sbs/, so www is
      the live host. Pointing canonical at the apex means pointing it at a
      redirect, which is what makes Search Console report "Sitemap could not be
      read" — GSC does not follow redirects for sitemap URLs.

      Must stay byte-identical to the <loc> in public/sitemap.xml and to og:url.
    -->
    <link rel="canonical" href="https://www.gymflow.sbs/" />

    <!--
      index,follow is already the default; spelled out so the intent is explicit
      alongside app.gymflow.sbs, which is deliberately noindex.
      max-image-preview:large opts into large image thumbnails in search results.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:url" content="https://www.gymflow.sbs/" />
    <meta property="og:locale" content="en_IN" />

    <!--
      og-image.jpg is exactly 1200x630 (1.90:1), the ratio every major platform
      crops to, and is kept well under ~300 KB because WhatsApp is unreliable
      above that — and WhatsApp is how this audience shares links.
      Declaring width/height lets platforms reserve the card layout before the
      image finishes downloading, so the preview does not reflow.
    -->
    <meta property="og:image" content="https://www.gymflow.sbs/og-image.jpg" />

    <meta property="og:image:width" content="1200" />

    <!--
      ─── THEME BOOTSTRAP ────────────────────────────────────────────────────
      Runs before first paint and before the CSS applies, so the theme is already
      on <html> when the page renders. Dark is the default, so without this the
      page would paint light and then swap to dark a frame later — a visible white
      flash for the majority of visits.

      Inline and synchronous on purpose: a deferred or external script would run
      after paint and defeat the point. Kept in sync with useTheme() in
      src/lib/useTheme.ts, which reads the same 'gf-theme' key.
    -->
    <script>
      (function () {
        // Dark is the default: a visitor with no saved choice always opens dark,
        // regardless of their OS setting. An explicit choice via the toggle still
        // wins for the rest of that visit. Because dark is the fallback, the
        // catch (storage disabled / private mode) also lands on dark rather than
        // needing to re-add the class.
        try {
          if (localStorage.getItem('gf-theme') !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!--
      ─── STRUCTURED DATA (JSON-LD) ──────────────────────────────────────────
      Six nodes, cross-referenced by @id rather than repeated:

        #organization  the brand / knowledge-panel entity
        #offer         the single ₹3,000-a-month plan, defined once and
                       referenced by both the Organization and the software
        #website       the site
        #webpage       this page, and what it is about
        #software      the product itself
        #howto         the four onboarding steps
        #faq           the six accordion questions

      THE GOVERNING RULE, stated precisely, because the distinction matters:

        CONTENT properties must appear verbatim in the rendered page. That is
        every FAQ question and answer, every HowTo step, featureList, and the
        price. Google treats markup describing content a visitor cannot see as
        spam, and an answer engine quoting a claim the page does not make is
        worse than not being quoted at all. If you edit that copy in a
        component, edit it here in the same commit.

        METADATA properties — name, description, browserRequirements — describe
        the entity rather than quote the page, and are not expected to be
        duplicated in body copy. They still have to be TRUE; they just do not
        have to be findable with ctrl-F.

      ─── SoftwareApplication IS PRESENT, WITHOUT RATINGS ────────────────────
      This node used to be omitted on the grounds that SoftwareApplication needs
      aggregateRating to win a rich result. That is true of the rich result and
      irrelevant to everything else: answer engines read the whole graph, and
      this is the node that lets one state what GymFlow is, what it runs on and
      what it costs. So the node is here and aggregateRating is not — inventing
      ratings the site cannot evidence is what earns a manual action. Add it only
      when real, verifiable reviews exist to point at.

      ─── HowTo MIRRORS src/components/HowItWorks.tsx ────────────────────────
      Four steps, names and text taken verbatim from the STEPS array there.
      No totalTime: the section says "in minutes", and converting that into a
      precise ISO duration would be inventing precision the page never claims.

      ─── FAQPage MIRRORS src/components/FAQ.tsx ─────────────────────────────
      The six visible accordion items, verbatim.
    -->
