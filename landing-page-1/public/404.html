<!doctype html>
<!--
  A real 404 page, served with a 404 status.

  Without this file the host answers every unknown path with index.html and a 200, a
  "soft 404": Google sees unlimited URLs that all return the home page, which wastes
  crawl budget and is reported in Search Console as "Soft 404" or "Duplicate without
  user-selected canonical". Static hosts (Vercel, Cloudflare Pages) serve a top-level
  404.html with the correct status for paths that match no file.

  Self-contained on purpose: no bundle, no fonts, so it renders even if the app's
  assets are what failed to load.
-->
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — GymFlow</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141414; color: #f5f5f5; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 520px; padding: 32px 20px; text-align: center; }
      p.code { font: 500 12px ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: #a3a3a3; }
      h1 { font-size: 34px; line-height: 1.15; font-weight: 500; letter-spacing: -.03em; margin: 12px 0; }
      p { color: #bebebe; }
      a.btn { display: inline-block; margin-top: 20px; padding: 12px 22px; border-radius: 9999px; background: #f5f5f5; color: #141414; font-weight: 500; text-decoration: none; }
      nav { margin-top: 24px; font-size: 14px; }
      nav a { color: #93c5fd; margin: 0 8px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page does not exist.</h1>
      <p>The link may be old or mistyped. GymFlow's website is a single page, so everything is one click away.</p>
      <a class="btn" href="/">Go to the GymFlow home page</a>
      <nav>
        <a href="/#pricing">Pricing</a>
        <a href="/#faq">FAQ</a>
        <a href="https://app.gymflow.sbs">Sign in</a>
      </nav>
    </main>
  </body>
</html>
