<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E3A8A" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>GymFlow — Gym Management for Tamil Nadu &amp; Puducherry Gyms</title>
    <meta name="description" content="GymFlow is the all-in-one gym management platform for independent gym owners. Track members, payments, attendance and dues, and send WhatsApp reminders — all in one place." />

    <!--
      Canonical URL. Consolidates the http:// variant and every ?utm_source=…
      share link, which would otherwise look like separate pages with identical
      content and split ranking signals. robots.txt cannot fix that; this is the
      only thing that does.

      NOTE THE www. The apex returns 308 -> https://www.gymflow.sbs/, so www is
      the live host. Pointing canonical at the apex meant pointing it at a
      redirect — and it is what made Google Search Console report "Sitemap could
      not be read", because GSC does not follow redirects for sitemap URLs.

      Must stay byte-identical to the <loc> in public/sitemap.xml and to og:url.
      If the apex is ever made canonical instead (by flipping the redirect at the
      host so www -> apex), update all three together.
    -->
    <link rel="canonical" href="https://www.gymflow.sbs/" />

    <!--
      index,follow is already the default; it is spelled out so the intent is
      explicit alongside app.gymflow.sbs, which is deliberately noindex.
      max-image-preview:large opts into large image thumbnails in search results
      instead of the default small one.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GymFlow" />
    <meta property="og:title" content="GymFlow — Know who paid. Who didn't. Who's expiring." />
    <meta property="og:description" content="The all-in-one gym management platform for independent gyms. Members, payments, attendance, dues, and WhatsApp reminders in one place." />
    <!-- Kept identical to <link rel="canonical"> and the sitemap <loc>. -->
    <meta property="og:url" content="https://www.gymflow.sbs/" />
    <meta property="og:locale" content="en_IN" />

    <!--
      og-image.jpg is generated from the full-res hero screenshot at exactly
      1200x630 (1.90:1), which is the ratio every major platform crops to.
      It replaced app.gymflow.sbs/logo_landspace.png, which was wrong on three
      counts: 2.25:1 so it got trimmed top and bottom, 952 KB (WhatsApp is
      unreliable much above ~300 KB, and WhatsApp is how this audience shares
      links), and served from the app domain so the marketing site's previews
      depended on another host.

      Declaring width/height lets platforms reserve the card layout before the
      image finishes downloading, so the preview does not reflow.
    -->
    <meta property="og:image" content="https://www.gymflow.sbs/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The GymFlow dashboard showing member counts, dues and expiring memberships at a glance." />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GymFlow — Gym Management, simplified" />
    <meta name="twitter:description" content="Members, payments, attendance, dues, and WhatsApp reminders in one place. Built for Tamil Nadu &amp; Puducherry gyms." />
    <meta name="twitter:image" content="https://www.gymflow.sbs/og-image.jpg" />
    <meta name="twitter:image:alt" content="The GymFlow dashboard showing member counts, dues and expiring memberships at a glance." />

    <!--
      ─── STRUCTURED DATA (JSON-LD) ──────────────────────────────────────────
      Two nodes: the Organization (brand/knowledge-panel entity) and the WebSite.
      Every value is also visible on the page — Google treats markup describing
      content a visitor cannot see as spam.

      ─── WHY THERE IS NO SoftwareApplication NODE ───────────────────────────
      An earlier version declared one. The Rich Results Test flagged it with a
      permanent non-critical issue: the "Software App" rich result REQUIRES a
      `aggregateRating` or `review`, and both require a numeric ratingValue.

      This page has no genuine rating to report — the testimonials in
      Testimonials.tsx are quotes with no star scores — and inventing a number is
      exactly what Google's review policy treats as spam (penalty: a site-wide
      manual action). A SoftwareApplication with no rating never produces a rich
      result anyway, so the type only bought a permanent advisory. It was removed.

      The price signal is preserved honestly via `makesOffer` on the Organization
      below: an Offer/Service is descriptive data, NOT one of Google's
      rich-result feature types, so it triggers no rating requirement and no
      warning. The ₹3,000/month figure mirrors the visible Pricing section
      (Pricing.tsx).

      TO EARN THE STAR RICH RESULT LATER: once real, consented customer ratings
      exist AND are shown on the page, re-add a SoftwareApplication node with an
      `aggregateRating` (ratingValue + ratingCount) sourced from those ratings.
      That is the only compliant path to stars.

      ─── CONTACT / ADDRESS ──────────────────────────────────────────────────
      contactPoint and address are COMPLETE with the business's real details.
      The second non-critical issue was caused by a partial version of these
      (a ContactPoint with no telephone, a PostalAddress with only region +
      country); filling in the real phone, email, locality and PIN resolves it.
      All of it is mirrored in the footer so the markup matches visible content,
      including the full streetAddress — filling that cleared the last
      "Missing field 'streetAddress'" advisory in the Rich Results Test.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.gymflow.sbs/#organization",
          "name": "GymFlow",
          "url": "https://www.gymflow.sbs/",
          "description": "Gym management software for independent gym owners in Tamil Nadu and Puducherry.",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.gymflow.sbs/logo_landspace_without_bg.webp",
            "width": 400,
            "height": 178
          },
          "image": "https://www.gymflow.sbs/og-image.jpg",
          "email": "ganesamurthiv@gmail.com",
          "telephone": "+91-93848-86895",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "telephone": "+91-93848-86895",
            "email": "ganesamurthiv@gmail.com",
            "availableLanguage": ["en", "ta"],
            "areaServed": "IN"
          },
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "No. 126, Anbu Nagar, Achariyapuram",
            "addressLocality": "Villianur",
            "addressRegion": "Puducherry",
            "postalCode": "605110",
            "addressCountry": "IN"
          },
          "areaServed": [
            { "@type": "State", "name": "Tamil Nadu" },
            { "@type": "AdministrativeArea", "name": "Puducherry" }
          ],
          "makesOffer": {
            "@type": "Offer",
            "price": "3000",
            "priceCurrency": "INR",
            "availability": "https://schema.org/InStock",
            "url": "https://www.gymflow.sbs/#pricing",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "price": "3000",
              "priceCurrency": "INR",
              "referenceQuantity": {
                "@type": "QuantitativeValue",
                "value": 1,
                "unitCode": "MON"
              }
            },
            "itemOffered": {
              "@type": "Service",
              "name": "GymFlow Pro",
              "serviceType": "Gym management software",
              "description": "All-in-one gym management for independent gym owners: member records, payments and dues, attendance, and automated WhatsApp reminders."
            }
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.gymflow.sbs/#website",
          "url": "https://www.gymflow.sbs/",
          "name": "GymFlow",
          "description": "Gym management software for independent gyms in Tamil Nadu and Puducherry.",
          "publisher": { "@id": "https://www.gymflow.sbs/#organization" },
          "inLanguage": "en-IN"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
