<!--
  Head boilerplate shared by every feature page (features.html, members.html, ...). The plugin in
  vite.config.ts splices this file into each of them, between the favicons and the per-page tags.
  Everything below is copied from index.html: the icons, fonts, theme bootstrap and the analytics
  snippet must stay byte-identical to it (the CSP in public/_headers is written around them), and
  scripts/check-copy-sync.mjs fails the build if either script drifts. Change both files together.
-->
<meta charset="UTF-8" />
    <!--
      Favicon set. Google Search shows the site icon in a small circle next to the result and
      asks for a square file whose size is a multiple of 48 px, so the 48 px ICO entry and
      the 192 px PNG are what it actually reads. The mark is a blue gradient on white with soft
      blue corner glows, kept inside the middle of the tile (about 60% of its width) so the
      circular crop never clips it. favicon.svg is the same design as real vector paths. The previous file was a
      non-square 1432x955 picture, which is why it looked squashed and blurry. Google can
      take several weeks to refresh a cached icon after this changes.
    -->
    <link rel="icon" href="/favicon.ico?v=4" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The site always opens in the light theme, whatever the visitor's OS setting, so
      the browser chrome is light for every scheme. Matches --background in src/index.css.
    -->
    <meta name="theme-color" content="#fafbfd" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three faces (DESIGN.md): Familjen Grotesk for headings, IBM Plex Sans for text, JetBrains Mono for
      times, IDs and tickets. The latin-ext subsets carry the rupee sign.
    -->
    <!--
      Non-blocking. A plain rel="stylesheet" here stops the first paint until Google Fonts
      answers (about a second on a throttled mobile connection, the largest single item in
      the Lighthouse render-blocking report). rel="preload" fetches it at once without
      blocking, and onload turns it into a stylesheet. display=swap shows the fallback font
      meanwhile. The <noscript> copy keeps fonts working with scripts off.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      />
    </noscript>
    <style>
      /* Hallmark · shape: SaaS narrative · genre: modern-minimal · theme: cobalt (brand blue) · redesign: full
       * paper: oklch(98.6% 0.005 250) · accent: #2563eb · display: Familjen Grotesk · body: IBM Plex Sans · hero: Settled · nav: slim bar · footer: letter close · signature: the product shown big over a dot grid with a floating WhatsApp confirmation card
       * axes: light/grotesk/blue · posture: restrained · contrast: pass · fold: pass · v2.0.0 · draw: cee847 */
      /* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: S, section compositions are rebuilt by the section agents in parallel */
      /* Token block for the first paint; the same values live in src/index.css.
         Night sits on the bare :root and paper on :root:not(.dark). */
      :root {
        --background: oklch(15% 0.02 262);
        --foreground: oklch(94% 0.008 250);
        --muted-foreground: oklch(74% 0.02 256);
        --hero-copy: oklch(84% 0.015 255);
        --border-strong: oklch(38% 0.035 262);
        --accent: #2563eb;
        --accent-ink: #ffffff;
        --accent-text: #93c5fd;
        --ring: #93c5fd;
        --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-display: "Familjen Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --accent-edge: oklch(39% 0.16 260);
        --space-sm: 12px;
        --space-lg: 24px;
        --space-xl: 40px;
        --space-2xl: 64px;
      }
      :root:not(.dark) {
        --background: oklch(98.6% 0.005 250);
        --foreground: oklch(21% 0.028 262);
        --muted-foreground: oklch(46% 0.02 258);
        --hero-copy: oklch(36% 0.022 260);
        --border-strong: oklch(83% 0.012 252);
        --accent-text: #1d4ed8;
        --ring: #1d4ed8;
      }
      html, body { overflow-x: clip; }
      :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      /* Light is the default; the toggle can still switch for the current visit. */
      html { background: var(--background); color-scheme: dark; }
      html:not(.dark) { background: var(--background); color-scheme: light; }
    </style>
<!--feature-meta-->
<!--
      ─── THEME BOOTSTRAP ────────────────────────────────────────────────────
      Runs before first paint and before the CSS applies, so the theme is already
      on <html> when the page renders. Light is the default; without this a visitor who
      switched to dark earlier in the visit would see the page paint light and then swap
      to dark a frame later.

      Inline and synchronous on purpose: a deferred or external script would run
      after paint and defeat the point. Kept in sync with useTheme() in
      src/lib/useTheme.ts (light on a new visit; a toggle choice lasts for the visit).
    -->
    <script>
      (function () {
        // Every visit opens in the light theme, for every visitor: no OS setting is consulted
        // and nothing outlives the tab. The one exception is a choice made with the toggle
        // earlier in this visit (sessionStorage, cleared when the tab closes), so moving
        // between the homepage, the feature pages and the legal pages keeps the theme.
        var dark = false;
        try { dark = sessionStorage.getItem('gf-theme') === 'dark'; } catch (e) {}
        document.documentElement.classList.toggle('dark', dark);
        // Marks that scripts run here. The static copy inside #root (see <body>) is for
        // readers that do not run JavaScript; with this class it is hidden, so a visitor
        // never sees it flash before React mounts.
        document.documentElement.classList.add('js');
      })();
    </script>
    <style>
      .mounted #seo-fallback { display: none; }
      /*
        The static copy is the first paint, not just a no-JavaScript fallback: it stays visible until
        React has mounted (the .mounted class, added after the first commit), so the screen is no
        longer blank while the 65 KB-brotli shared chunk downloads (feature pages measured 3.7 s to
        first paint on a throttled phone, 4.5 s in the audit). Styled to look like the real hero's
        first screen: same stack and sizes, centred H1, muted intro, pill buttons, and the
        breadcrumb small and muted above the H1. Colours come from the token block above, which mirrors src/index.css
        (--background, --foreground, --muted-foreground, --hero-copy, --border-strong) because
        this block loads before that file; html.dark is set by the bootstrap script above.
      */
      #seo-fallback { max-width: 760px; margin: 0 auto; padding: 124px 20px 48px; font: 16px/1.6 var(--font-sans); color: var(--foreground); }
      #seo-fallback a { color: var(--accent-text); }
      #seo-fallback nav { text-align: center; font-size: 13px; line-height: 32px; color: var(--muted-foreground); }
      #seo-fallback nav a { color: inherit; text-decoration: none; }
      #seo-fallback h1 { margin: var(--space-lg) 0 0; text-align: center; text-wrap: balance; font-family: var(--font-display); font-size: clamp(44px, 6vw, 88px); font-weight: 600; line-height: 1.04; letter-spacing: -0.028em; }
      #root:not([data-page]) #seo-fallback h1 { margin-top: var(--space-2xl); font-size: clamp(52px, 7.5vw, 104px); line-height: 1.02; }
      #seo-fallback h1 + p { max-width: 640px; margin: var(--space-lg) auto 0; text-align: center; font-size: clamp(16px, 1.35vw, 19px); color: var(--hero-copy); }
      #seo-fallback h1 + p + p { display: flex; justify-content: center; gap: var(--space-sm); margin-top: 32px; font-size: 0; }
      #seo-fallback h1 + p + p a { flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; padding: var(--space-sm) var(--space-lg); min-height: 48px; border-radius: 10px; font-family: var(--font-display); font-size: 16px; font-weight: 500; line-height: 1; white-space: nowrap; text-decoration: none; color: var(--foreground); border: 1px solid var(--border-strong); }
      #seo-fallback h1 + p + p a:first-child { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-edge); }
      @media (min-width: 640px) { #seo-fallback h1 + p + p a { flex: none; } }
      #seo-fallback h1 + p + p + p { margin-top: var(--space-lg); text-align: center; font-size: 13px; color: var(--muted-foreground); }
      #seo-fallback h2 { font-size: 28px; line-height: 1.1; margin-top: 36px; font-weight: 600; letter-spacing: -0.02em; }
      #seo-fallback h3 { font-size: 20px; line-height: 1.15; margin-top: 20px; font-weight: 500; }
    </style>
<!--
      Google Analytics 4, in Consent Mode. analytics_storage starts "denied": the tag is set up
      (gtag.js is fetched only after consent, see gfLoadGtag) and sets no cookies and keeps no identifier until
      the visitor allows visit counting in the cookie card, which calls
      gtag('consent', 'update', ...) (src/lib/analytics.ts). A returning visitor who already
      allowed it is granted straight away from the saved choice. Only on the real domain, so
      local and preview builds never count.
    -->
    <script>
      (function () {
        if (!/(^|\.)gymflow\.sbs$/.test(location.hostname)) return;
        var ID = 'G-X851XRNHBD';
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        var allowed = false;
        try {
          allowed = JSON.parse(localStorage.getItem('gf-cookie-consent-v2') || 'null').ga === true;
        } catch (e) {}
        gtag('consent', 'default', {
          analytics_storage: allowed ? 'granted' : 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
        });
        gtag('js', new Date());
        gtag('config', ID);
        // gtag.js itself is fetched only once visit counting is allowed: at once for a returning
        // visitor who already allowed it, and for a new one when they accept (analytics.ts calls
        // this). Until then the commands above only queue in dataLayer and nothing is requested.
        var loaded = false;
        window.gfLoadGtag = function () {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
          document.head.appendChild(s);
        };
        if (allowed) window.gfLoadGtag();
      })();
    </script>
