<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <title>You're offline — GymFlow</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,420px);padding:28px;border:1px solid #e2e8f0;border-radius:16px;background:#fff;box-shadow:0 10px 25px rgba(15,23,42,.08);text-align:center}.icon{width:64px;height:64px;border-radius:16px}.eyebrow{margin:20px 0 6px;color:#1d4ed8;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}h1{margin:0;font-size:28px;line-height:1.25}p{margin:12px 0 22px;color:#475569;font-size:15px;line-height:1.6}a{display:flex;min-height:48px;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(to right,#2563eb,#1d4ed8);color:#fff;font-size:14px;font-weight:700;text-decoration:none}a:focus-visible{outline:3px solid #2563eb;outline-offset:3px}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/logo_only.png" alt="GymFlow" width="64" height="64" />
    <p class="eyebrow">GymFlow Member</p>
    <h1>You're offline</h1>
    <p>Reconnect to securely refresh your member data. Cached app assets remain available, but GymFlow never stores authenticated API responses in the service-worker cache.</p>
    <a href="/home">Try again</a>
  </main>
</body>
</html>
