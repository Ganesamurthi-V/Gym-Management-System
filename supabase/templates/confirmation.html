<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:32px">
            <tr><td style="font-size:24px;font-weight:800;padding-bottom:12px">Confirm your GymFlow email</td></tr>
            <tr><td style="font-size:15px;line-height:1.6;color:#475569;padding-bottom:24px">Hi {{ if .Data.full_name }}{{ .Data.full_name }}{{ else }}there{{ end }}, confirm your email address to finish creating your gym owner account.</td></tr>
            <tr>
              <td align="center" style="padding-bottom:24px">
                <!-- The one-time TokenHash stays in the fragment. Link scanners request only the page URL and cannot consume it. -->
                <a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#0f172a;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:14px 24px;border-radius:10px">Verify email and set password</a>
              </td>
            </tr>
            <tr><td style="font-size:12px;line-height:1.5;color:#94a3b8">If you did not create a GymFlow account, you can safely ignore this email.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
